<title>Zafa’s English Adventure</title>
<style>
:root{--bg:#bfe8ff;--bg2:#e9f8ff;--card:#fff;--ink:#1f2a44;--mut:#5d6b8a;--sun:#ffcf3f;--ok:#2fb35f;--bad:#e5484d;--line:#cfe0ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14213d;--bg2:#1d2d52;--card:#26385f;--ink:#f2f6ff;--mut:#a9b7d6;--line:#3a4f7e;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;color:var(--ink);font-family:ui-rounded,"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:linear-gradient(var(--bg),var(--bg2)) fixed}
#app{max-width:520px;margin:0 auto;padding:10px 14px 28px;text-align:center}
h1{font-size:27px;margin:6px 0 2px;letter-spacing:-.5px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800}
.lk{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:7px 12px;font-weight:800;box-shadow:0 3px 0 var(--line)}
.zafa{font-size:70px;line-height:1;animation:bob 2.4s ease-in-out infinite}
.bub{position:relative;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:12px 14px;margin:12px 0;font-weight:700;font-size:18px;box-shadow:0 4px 0 var(--line)}
.bub small{display:block;color:var(--mut);font-weight:600;font-size:14px;margin-top:4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pl{background:var(--card);border:3px solid var(--c);border-radius:22px;padding:14px 6px;box-shadow:0 6px 0 var(--c);display:flex;flex-direction:column;gap:2px;align-items:center}
.pl span{font-size:46px}.pl b{font-size:19px}.pl small{color:var(--mut)}.pl em{font-style:normal;color:#f0a500;letter-spacing:2px}
.pl:active,.op:active,.go:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.go{background:var(--ok);color:#fff;border:0;border-radius:18px;padding:14px;font-weight:800;font-size:19px;width:100%;margin-top:12px;box-shadow:0 5px 0 #1d7d42}
.big{font-size:110px;line-height:1.1;margin:6px auto;background:none;border:0}
.sp{background:var(--sun);border-radius:50%;width:140px;height:140px;font-size:64px;box-shadow:0 6px 0 #d9a800;display:block}
.g1{display:grid;gap:10px}.g1 .op{font-size:24px}
.op{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:12px;font-weight:800;font-size:22px;box-shadow:0 5px 0 var(--line)}
.op.em{font-size:56px;padding:6px}
.op.good{background:#c9f5d8;border-color:var(--ok);box-shadow:0 5px 0 var(--ok);color:#12351f}
.op.bad{opacity:.45;border-color:var(--bad);animation:shake .35s}
.bar{display:flex;gap:4px;flex:1}.bar i{flex:1;height:10px;border-radius:6px;background:var(--line)}.bar i.on{background:var(--ok)}.bar i.cur{background:var(--sun)}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.slot{width:38px;height:46px;border-bottom:4px solid var(--ink);font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center}
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tiles .op{width:54px;height:58px;padding:0;font-size:28px;text-transform:lowercase}
.tiles .op:disabled{opacity:.25}
.fb{min-height:28px;font-weight:800;font-size:18px;margin-top:10px}
.stk{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sk{background:var(--card);border:3px dashed var(--line);border-radius:16px;padding:8px 2px;font-weight:800}
.sk.on{border:3px solid var(--sun);border-style:solid;transform:rotate(-2deg);box-shadow:0 4px 0 var(--sun)}
.sk.on:nth-child(even){transform:rotate(2deg)}.sk span{font-size:38px;display:block}.sk small{color:var(--mut)}
.stars{font-size:54px;color:#f0a500;letter-spacing:6px}
.cf{position:fixed;pointer-events:none;z-index:9;font-size:26px;animation:fall 1.4s ease-out forwards}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes fall{30%{transform:translate(calc(var(--dx)*.5),-70px) scale(1.2)}to{transform:translate(var(--dx),170px) rotate(300deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.big svg{width:120px;height:120px;display:block;margin:auto}.sp svg{width:70px;height:70px}.op.em svg{width:68px;height:68px;display:block;margin:auto}.pl span svg{width:58px;height:58px}.zafa svg{width:86px;height:86px}.sk span svg{width:48px;height:48px;margin:auto}.pics{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.pics svg{width:44px;height:44px}.lk svg,.hd b svg{width:1.2em;height:1.2em;vertical-align:-.25em}
.scn{width:100%;height:auto;border-radius:18px;border:3px solid var(--line);display:block}
.pw{position:relative}.pw .pl{width:100%;height:100%}.pn{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;padding:0;color:var(--mut)}.pn svg{width:20px;height:20px}.pn.on{background:#ffe3e3;border-color:#e5484d}
html,body{height:100%;min-height:0;overflow:hidden}html{height:100dvh}
#vp{height:100%;overflow:hidden}#app{padding:4px 12px}
h1{font-size:21px;margin:2px 0}.hd{margin-bottom:2px}
.zafa{font-size:0}.zafa svg{width:60px;height:60px}
.bub{margin:6px 0;padding:8px 10px;font-size:16px;box-shadow:0 3px 0 var(--line)}.bub small{font-size:13px;margin-top:2px}
.g2,.g1{gap:8px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hm{grid-auto-rows:1fr}.hm .pl{padding:6px 4px;gap:0;height:100%;justify-content:center;box-shadow:0 4px 0 var(--c)}
.hm .pl small{display:none}.hm .pl b{font-size:15px;line-height:1.15}
.hm .pl span svg{width:clamp(32px,6.2dvh,46px);height:clamp(32px,6.2dvh,46px)}.hm .pl em{font-size:13px;letter-spacing:1px}
.hm .scn{width:auto;max-width:100%;max-height:10dvh;margin:2px auto;border-width:2px}
.big svg{width:clamp(64px,14dvh,110px);height:clamp(64px,14dvh,110px)}
.sp{width:clamp(76px,15dvh,120px);height:clamp(76px,15dvh,120px)}.sp svg{width:60%;height:60%}
.op{padding:9px 6px;font-size:20px;box-shadow:0 4px 0 var(--line)}.g3 .op{font-size:16px;padding:10px 2px}
.op.em{padding:4px}.op.em svg{width:clamp(44px,9dvh,62px);height:clamp(44px,9dvh,62px)}
.go{margin-top:6px;padding:11px;font-size:18px}.fb{min-height:24px;margin-top:4px;font-size:16px}#nx{min-height:56px}
.slots{margin:6px 0}.slot{width:32px;height:40px;font-size:26px}.tiles .op{width:46px;height:50px;font-size:24px}
.stars{font-size:40px}
.tsc{width:auto;max-width:100%;max-height:23dvh;margin:6px auto 0}.tx{font-size:15px;text-align:left}.tx small{font-size:13px}.tq{font-size:16px;margin:4px 0}
.stk{grid-template-columns:repeat(8,1fr);gap:5px}.sk{padding:3px 0;border-radius:10px;border-width:2px}.sk span{font-size:20px}.sk span svg{width:100%;max-width:40px;height:auto}
</style></head>

  setTimeout(()=>say(c.t),400)}
function tans(b){const c=TALES[T.k].sc[T.j];
  if(b.dataset.v===c.o[0]){$("#bl").textContent=c.o[0];b.classList.add("good");document.querySelectorAll(".op").forEach(x=>x.disabled=true);sOk();conf(8);$("#fb").innerHTML='<span style="color:var(--ok)">Great!</span>';$("#nx").innerHTML=`<button class="go" data-a="tnext">${T.j+1>=TALES[T.k].sc.length?"Finish":"Next"}</button>`}
  else{T.m++;sBad();b.disabled=true;b.classList.add("bad");$("#fb").innerHTML='<span style="color:var(--bad)">Try again!</span> Coba lagi!'}}
function tnext(){T.j++;T.j>=TALES[T.k].sc.length?tend():tscene()}
function tend(){const t=TALES[T.k],st=T.m<=1?3:T.m<=3?2:1;D.tale=D.tale||{};D.tale[t.id]=Math.max(D.tale[t.id]||0,st);sv();sWin();conf(30);
  A.innerHTML=tb(1)+`<h1>The End</h1><svg class="scn" viewBox="0 0 120 64">${t.p[t.p.length-1]}</svg><div class="stars">${"★".repeat(st)}${"☆".repeat(3-st)}</div><p class="bub">Moral: ${t.mo[0]}<small>Pesan: ${t.mo[1]}.${T.m?" Salah: "+T.m+". Coba lagi untuk 3 bintang!":""}</small></p><button class="go" data-a="tell" data-i="${T.k}">Read again</button><button class="lk" style="margin-top:12px" data-a="tales">More tales</button>`}
A.onclick=e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v;
  if(a==="home")home();else if(a==="story")story(+b.dataset.i);else if(a==="start")start();else if(a==="album")album();
  else if(a==="say")say(v);else if(a==="pin"){const p=D.pin=D.pin||[],i=p.indexOf(v);i<0?p.push(v):p.splice(i,1);sv();tn(520,.07);v.startsWith("t:")?tales():home()}else if(a==="tales")tales();else if(a==="tell")tell(+b.dataset.i);else if(a==="tans")tans(b);else if(a==="tnext")tnext();

  else if(a==="next"){R.i++;R.i>=R.q.length?finish():ask()}
};
